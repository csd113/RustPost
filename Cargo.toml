[package]
name = "rustpost"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A single-binary self-hosted microblogging app"
repository = "https://github.com/csd113/RustPost"
rust-version = "1.90"
keywords = ["microblog", "self-hosted", "sqlite", "axum"]
categories = ["web-programming::http-server"]

[[bin]]
name = "rustpost-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arti-client = { version = "=0.42.0", default-features = false, features = ["tokio", "rustls", "onion-service-service"] }
argon2 = "0.5"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
html-escape = "0.2"
infer = "0.19"
rand_core = { version = "0.6", features = ["getrandom"] }
safelog = "0.8"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
rusqlite = { version = "0.39", features = ["bundled"] }
tar = "0.4"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "fs", "process", "signal", "net", "time", "io-util", "sync"] }
toml = "0.9"
tor-cell = "=0.42.0"
tor-hsservice = "=0.42.0"
tor-proto = { version = "=0.42.0", features = ["tokio"] }
tor-rtcompat = { version = "=0.42.0", default-features = false, features = ["tokio", "rustls"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

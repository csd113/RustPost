[package]
name = "rustpost"
version = "1.2.0"
edition = "2024"
license = "MIT"
description = "A single-binary self-hosted microblogging app"
repository = "https://github.com/csd113/RustPost"
rust-version = "1.99.1"
keywords = ["microblog", "self-hosted", "sqlite", "axum"]
categories = ["web-programming::http-server"]
autobins = false
autotests = false
autobenches = false

[lib]
doctest = false
test = true
bench = false

[[bin]]
name = "rustpost-cli"
path = "src/bin/rustpost-cli.rs"
test = false
bench = false

[dependencies]
anyhow = "1.0.104"
arti-client = { version = "=0.48.0", default-features = false, features = ["tokio", "rustls", "onion-service-service"] }
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
captcha = { version = "1.0", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
futures-util = "0.3.34"
flate2 = "1.1.10"
html-escape = "0.3.0"
# Enforce a small streaming cap on URL-encoded forms independently of media.
http-body-util = "0.1.5"
infer = "0.22"
getrandom = "0.4.3"
safelog = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
ring = "0.17.14"
sha2 = "0.11.1"
# Already used by the Tor stack; constant-time CSRF digest comparison.
subtle = "2.6.1"
# Arti 0.48 requires rusqlite >=0.36,<0.41; SQLite can only be linked once.
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "backup", "hooks"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "process", "signal", "net", "time", "io-util", "sync"] }
toml = "1.2.0"
tor-cell = { version = "=0.48.0", default-features = false }
tor-hsservice = { version = "=0.48.0", default-features = false }
tor-proto = { version = "=0.48.0", default-features = false, features = ["tokio"] }
tor-rtcompat = { version = "=0.48.0", default-features = false, features = ["tokio", "rustls"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
walkdir = "2.5"
zeroize = "1.9.1"
unicode-segmentation = "1.13.3"
# Already in the Arti dependency graph; safe cross-platform disk headroom checks.
sysinfo = { version = "0.38.4", default-features = false, features = ["disk", "linux-tmpfs", "linux-netdevs"] }

[target.'cfg(windows)'.dependencies]
# Crossterm's Windows raw-mode reset does not preserve initially disabled flags.
crossterm_winapi = "0.9.1"

[[test]]
name = "terminal_regressions"
path = "tests/terminal_regressions.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

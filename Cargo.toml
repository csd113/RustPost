[package]
name = "rustpost"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A single-binary self-hosted microblogging app"
repository = "https://github.com/csd113/RustPost"
rust-version = "1.90"
keywords = ["microblog", "self-hosted", "sqlite", "axum"]
categories = ["web-programming::http-server"]
autobins = false

[[bin]]
name = "rustpost-cli"
path = "src/bin/rustpost-cli.rs"

[dependencies]
anyhow = "1.0.102"
arti-client = { version = "=0.43.0", default-features = false, features = ["tokio", "rustls", "onion-service-service"] }
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22.1"
captcha = { version = "1.0", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
futures-util = "0.3.32"
flate2 = "1.1.9"
html-escape = "0.2.13"
infer = "0.19"
getrandom = "0.4.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
safelog = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "fs", "process", "signal", "net", "time", "io-util", "sync"] }
toml = "1.1.2"
tor-cell = "=0.43.0"
tor-hsservice = "=0.43.0"
tor-proto = { version = "=0.43.0", features = ["tokio"] }
tor-rtcompat = { version = "=0.43.0", default-features = false, features = ["tokio", "rustls"] }
tower-http = { version = "0.6.11", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
http-body-util = "0.1.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

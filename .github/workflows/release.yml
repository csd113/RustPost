name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-unix:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive: rustpost-macos-aarch64.tar.gz
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: rustpost-linux-x86_64.tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: rustpost-linux-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bins
      - name: Package archive
        run: |
          set -euo pipefail
          staging="dist/${{ matrix.name }}/rustpost"
          mkdir -p "$staging"
          test "$(target/${{ matrix.target }}/release/rustpost-cli --version)" = "rustpost-cli ${GITHUB_REF_NAME#v}"
          cp "target/${{ matrix.target }}/release/rustpost-cli" "$staging/"
          cp "target/${{ matrix.target }}/release/rustpost-updater" "$staging/"
          if [ "${{ runner.os }}" = "Linux" ] && [[ "$GITHUB_REF_NAME" != *-* ]]; then
            python3 tools/package-update.py --binary "target/${{ matrix.target }}/release/rustpost-cli" --target "${{ matrix.target }}" --version "$GITHUB_REF_NAME" --output dist
          fi
          cp README.md "$staging/"
          if [ -f LICENSE ]; then cp LICENSE "$staging/"; fi
          if [ -f NOTICE ]; then cp NOTICE "$staging/"; fi
          if [ -f NOTICES ]; then cp NOTICES "$staging/"; fi
          tar -czf "dist/${{ matrix.archive }}" -C "dist/${{ matrix.name }}" rustpost
          (cd dist && shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256")
      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.*
          if-no-files-found: error

  build-windows:
    name: Build windows-x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin rustpost-cli
      - name: Package archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = "dist/windows-x86_64/rustpost"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          if ((& target/x86_64-pc-windows-msvc/release/rustpost-cli.exe --version) -ne "rustpost-cli $version") { throw "Tag does not match executable" }
          Copy-Item "target/x86_64-pc-windows-msvc/release/rustpost-cli.exe" $staging
          Copy-Item "README.md" $staging
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" $staging }
          if (Test-Path "NOTICE") { Copy-Item "NOTICE" $staging }
          if (Test-Path "NOTICES") { Copy-Item "NOTICES" $staging }
          Compress-Archive -Path $staging -DestinationPath "dist/rustpost-windows-x86_64.zip" -Force
          (Get-FileHash "dist/rustpost-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower() + "  rustpost-windows-x86_64.zip" | Out-File -Encoding ascii "dist/rustpost-windows-x86_64.zip.sha256"
      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.*
          if-no-files-found: error

  publish:
    name: Verify, sign and publish complete release
    needs: [build-unix, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign and publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTPOST_UPDATE_SIGNING_KEY: ${{ secrets.RUSTPOST_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then test -n "$RUSTPOST_UPDATE_SIGNING_KEY"; fi
          key="$RUNNER_TEMP/rustpost-update-signing.pem"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$RUSTPOST_UPDATE_SIGNING_KEY" > "$key"
          unset RUSTPOST_UPDATE_SIGNING_KEY
          for archive in rustpost-linux-x86_64.tar.gz rustpost-linux-aarch64.tar.gz rustpost-macos-aarch64.tar.gz rustpost-windows-x86_64.zip; do
            test -s "dist/$archive"
            (cd dist && sha256sum -c "$archive.sha256")
          done
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"; then
              test "$(cat "$RUNNER_TEMP/is-draft")" = true
            else
              gh release create "$GITHUB_REF_NAME" --draft --prerelease --verify-tag --generate-notes
            fi
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/*.sha256 --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
            exit 0
          fi
          test -s "$key"
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"; then
            test "$(cat "$RUNNER_TEMP/is-draft")" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          fi
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.id')
          python3 tools/sign-updates.py --directory dist --key "$key" --release-id "$release_id" --version "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/*.sha256 dist/rustpost-update-*.json dist/rustpost-update-*.sig --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

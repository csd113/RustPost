name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-unix:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive: rustpost-macos-aarch64.tar.gz
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: rustpost-linux-x86_64.tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: rustpost-linux-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin rustpost-cli
      - name: Package archive
        run: |
          set -euo pipefail
          staging="dist/${{ matrix.name }}/rustpost"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/rustpost-cli" "$staging/"
          cp README.md "$staging/"
          if [ -f LICENSE ]; then cp LICENSE "$staging/"; fi
          if [ -f NOTICE ]; then cp NOTICE "$staging/"; fi
          if [ -f NOTICES ]; then cp NOTICES "$staging/"; fi
          tar -czf "dist/${{ matrix.archive }}" -C "dist/${{ matrix.name }}" rustpost
          shasum -a 256 "dist/${{ matrix.archive }}" > "dist/${{ matrix.archive }}.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256

  build-windows:
    name: Build windows-x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin rustpost-cli
      - name: Package archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = "dist/windows-x86_64/rustpost"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/rustpost-cli.exe" $staging
          Copy-Item "README.md" $staging
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" $staging }
          if (Test-Path "NOTICE") { Copy-Item "NOTICE" $staging }
          if (Test-Path "NOTICES") { Copy-Item "NOTICES" $staging }
          Compress-Archive -Path $staging -DestinationPath "dist/rustpost-windows-x86_64.zip" -Force
          (Get-FileHash "dist/rustpost-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower() + "  rustpost-windows-x86_64.zip" | Out-File -Encoding ascii "dist/rustpost-windows-x86_64.zip.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rustpost-windows-x86_64.zip
            dist/rustpost-windows-x86_64.zip.sha256

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  strict-clippy:
    name: Strict Clippy (${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.99.0", "stable"]
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Install selected Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery -D clippy::cargo

      - name: Test latest stable
        if: matrix.rust == 'stable'
        run: cargo test --locked --workspace --all-features

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-aarch64
            os: macos-14
          - name: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Run tests
        run: cargo test --locked --workspace --all-features
      - name: Build CLI
        run: cargo build --locked --workspace --all-features --bin rustpost-cli

  release-tools:
    name: Signed update packaging tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release signatures and rejection paths
        run: python3 tools/test-release-tools.py

  msrv:
    name: Rust 1.91 compatibility
    env:
      RUSTUP_TOOLCHAIN: "1.91.0"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Check minimum supported Rust
        run: cargo check --locked --workspace --all-features

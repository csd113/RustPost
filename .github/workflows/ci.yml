name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  strict-clippy:
    name: Strict Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery -D clippy::cargo

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-aarch64
            os: macos-14
          - name: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Build CLI
        run: cargo build --workspace --all-features --bin rustpost-cli

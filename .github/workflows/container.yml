name: Container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.0.0 application source
        run: |
          git fetch --depth=1 origin tag v1.0.0
          git diff --quiet v1.0.0 -- Cargo.toml Cargo.lock src
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/csd113/rustpost:1.0.0-${{ matrix.arch }}
          provenance: false

  publish:
    name: Publish version and latest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-platform tags
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/csd113/rustpost:1.0.0 \
            --tag ghcr.io/csd113/rustpost:latest \
            ghcr.io/csd113/rustpost:1.0.0-amd64 \
            ghcr.io/csd113/rustpost:1.0.0-arm64
      - name: Inspect published image
        run: docker buildx imagetools inspect ghcr.io/csd113/rustpost:1.0.0

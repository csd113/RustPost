name: Container

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Published source tag to build (for example v1.0.0)
        required: true
        type: string

env:
  RUSTPOST_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RUSTPOST_RELEASE_TAG }}
      - name: Resolve and validate version
        id: version
        run: |
          version="${RUSTPOST_RELEASE_TAG#v}"
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')" = "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/csd113/rustpost:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          build-args: RUSTPOST_VERSION=${{ steps.version.outputs.value }}
          provenance: false

  publish:
    name: Publish version and latest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-platform tags
        run: |
          version="${RUSTPOST_RELEASE_TAG#v}"
          tags=(--tag "ghcr.io/csd113/rustpost:$version")
          if [[ "$version" != *-* ]]; then tags+=(--tag ghcr.io/csd113/rustpost:latest); fi
          docker buildx imagetools create "${tags[@]}" \
            "ghcr.io/csd113/rustpost:$version-amd64" \
            "ghcr.io/csd113/rustpost:$version-arm64"
      - name: Inspect published image
        run: docker buildx imagetools inspect "ghcr.io/csd113/rustpost:${RUSTPOST_RELEASE_TAG#v}"
